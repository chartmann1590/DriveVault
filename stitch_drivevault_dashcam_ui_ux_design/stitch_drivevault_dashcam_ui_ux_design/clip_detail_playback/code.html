<script>
        // Telemetry Overlay Toggle
        let telemetryVisible = false;
        function toggleTelemetry() {
            const overlay = document.getElementById('telemetryOverlay');
            const btn = document.getElementById('toggleOverlayBtn');
            telemetryVisible = !telemetryVisible;
            
            if(telemetryVisible) {
                overlay.classList.remove('opacity-0');
                btn.classList.add('text-primary');
                btn.classList.remove('text-on-surface-variant');
            } else {
                overlay.classList.add('opacity-0');
                btn.classList.remove('text-primary');
                btn.classList.add('text-on-surface-variant');
            }
        }

        // Camera Swap Logic
        function swapCameras() {
            const mainImg = document.getElementById('mainVideoImage');
            const pipImg = document.getElementById('pipVideoImage');
            
            // Swap src
            const tempSrc = mainImg.src;
            mainImg.src = pipImg.src;
            pipImg.src = tempSrc;

            // Swap alt tags
            const tempAlt = mainImg.getAttribute('data-alt');
            mainImg.setAttribute('data-alt', pipImg.getAttribute('data-alt'));
            pipImg.setAttribute('data-alt', tempAlt);

            // Optional: Add a brief flash/transition effect
            mainImg.style.opacity = '0.5';
            setTimeout(() => {
                mainImg.style.opacity = '1';
            }, 150);
        }

        // Lock Toggle Logic
        let isLocked = true;
        function toggleLock() {
            const btn = document.getElementById('lockBtn');
            const icon = document.getElementById('lockIcon');
            const text = document.getElementById('lockText');
            isLocked = !isLocked;

            if(isLocked) {
                btn.classList.add('text-primary');
                btn.classList.remove('text-on-surface');
                icon.innerText = 'lock';
                icon.style.fontVariationSettings = "'FILL' 1";
                text.innerText = 'Locked';
            } else {
                btn.classList.remove('text-primary');
                btn.classList.add('text-on-surface');
                icon.innerText = 'lock_open';
                icon.style.fontVariationSettings = "'FILL' 0";
                text.innerText = 'Unlock';
            }
        }
    </script>
