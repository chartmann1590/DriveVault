<style>

            }

                opacity: 0.85;

            }
        }

<span class="material-symbols-outlined text-[24px]">settings_remote</span>

<script>
        // Simple script to toggle mic icon state for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.querySelector('button:has(.material-symbols-outlined:contains("mic"))');
            if(micBtn) {
                micBtn.addEventListener('click', function() {
                    const icon = this.querySelector('.material-symbols-outlined');
                    if(icon.textContent === 'mic') {
                        icon.textContent = 'mic_off';
                        icon.classList.remove('text-on-surface');
                        icon.classList.add('text-error');
                        this.classList.add('bg-white/10');
                    } else {
                        icon.textContent = 'mic';
                        icon.classList.add('text-on-surface');
                        icon.classList.remove('text-error');
                        this.classList.remove('bg-white/10');
                    }
                });
            }
        });
        
        // Polyfill for :contains selector used above since it's not standard JS
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            const icon = btn.querySelector('.material-symbols-outlined');
            if(icon && icon.textContent === 'mic') {
                btn.addEventListener('click', function() {
                    if(icon.textContent === 'mic') {
                        icon.textContent = 'mic_off';
                        icon.classList.remove('text-on-surface');
                        icon.classList.add('text-error');
                        this.classList.add('bg-white/10');
                    } else {
                        icon.textContent = 'mic';
                        icon.classList.add('text-on-surface');
                        icon.classList.remove('text-error');
                        this.classList.remove('bg-white/10');
                    }
                });
            }
        });
    </script>
