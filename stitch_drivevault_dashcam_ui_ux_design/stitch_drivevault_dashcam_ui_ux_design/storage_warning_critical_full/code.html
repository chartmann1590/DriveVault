<script>
        // Simple micro-interaction for unlocking clips
        document.querySelectorAll('button[aria-label="Unlock clip"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const icon = this.querySelector('.material-symbols-outlined');
                
                // Toggle lock/unlock visually
                if(icon.textContent === 'lock') {
                    icon.textContent = 'lock_open';
                    icon.classList.remove('icon-fill');
                    this.classList.remove('text-primary');
                    this.classList.add('text-secondary');
                    
                    // Dim the parent clip container
                    this.closest('.glass-panel').classList.add('opacity-50');
                } else {
                    icon.textContent = 'lock';
                    icon.classList.add('icon-fill');
                    this.classList.add('text-primary');
                    this.classList.remove('text-secondary');
                    
                    // Restore parent clip container
                    this.closest('.glass-panel').classList.remove('opacity-50');
                }
            });
        });
    </script>
