<script>
        // Simple Bottom Sheet Logic
        const btnExport = document.getElementById('btn-export');
        const sheetContainer = document.getElementById('export-sheet-container');
        const backdrop = document.getElementById('export-backdrop');
        const sheet = document.getElementById('export-sheet');
        const btnStartRender = document.getElementById('btn-start-render');
        const renderProgress = document.getElementById('render-progress');

        function openSheet() {
            sheetContainer.classList.remove('opacity-0', 'pointer-events-none');
            backdrop.classList.add('pointer-events-auto');
            setTimeout(() => {
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeSheet() {
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                sheetContainer.classList.add('opacity-0', 'pointer-events-none');
                backdrop.classList.remove('pointer-events-auto');
                // Reset state
                renderProgress.classList.add('hidden');
                btnStartRender.classList.remove('hidden');
            }, 300);
        }

        btnExport.addEventListener('click', openSheet);
        backdrop.addEventListener('click', closeSheet);

        // Simulate Rendering
        btnStartRender.addEventListener('click', () => {
            btnStartRender.classList.add('hidden');
            renderProgress.classList.remove('hidden');
            renderProgress.classList.add('flex');
            // In a real app, you'd update the progress bar width here
        });

        // Basic drag visual interaction for customizer (visual only for mockup)
        const widgets = document.querySelectorAll('.drag-handle');
        widgets.forEach(widget => {
            widget.addEventListener('mousedown', () => widget.classList.add('opacity-80', 'scale-105', 'z-10'));
            widget.addEventListener('mouseup', () => widget.classList.remove('opacity-80', 'scale-105', 'z-10'));
            widget.addEventListener('mouseleave', () => widget.classList.remove('opacity-80', 'scale-105', 'z-10'));
        });
    </script>
