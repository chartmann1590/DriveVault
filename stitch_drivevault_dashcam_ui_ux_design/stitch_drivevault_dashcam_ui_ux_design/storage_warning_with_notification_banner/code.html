<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DriveVault - Low Storage Warning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;

<script id="tailwind-config">

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#004493",

                    "secondary-container": "#4a4949",

            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "xl": "0.75rem",

                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "touch-target-min": "48px",
                    "safe-area-top": "32px",
                    "margin-edge": "24px",
                    "container-gap": "12px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-md-mobile": ["Inter"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-lg antialiased overflow-hidden selection:bg-primary/30 selection:text-primary"><div class="fixed top-0 left-0 right-0 z-[100] bg-error text-white px-margin-edge py-3 flex items-center justify-between shadow-lg">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-2xl">report_problem</span>
<span class="font-label-xl">Storage Critical: 500MB Remaining</span>
</div>
<button class="flex items-center justify-center hover:bg-white/10 rounded-full p-1 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Background Context (Simulated Dashcam Feed) -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat" data-alt="A realistic, high-definition view from a vehicle dashboard camera driving down a dimly lit suburban road at dusk. The scene is slightly blurred to simulate motion and depth. The mood is functional and utilitarian. The lighting is low-key, with streetlights casting faint yellow glows against a predominantly dark, deep charcoal environment, characteristic of a high-end automotive dashcam interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQanWVnmCTEa7AVJLEbfdGuQPBsKlnewgczMKAPxcyiTBMDO_wfyLmmgUbQ3D1ZupaLbMAja4qucLjvqaVVw3dKrpOvnjFYUhKot5uZqa1MWVdmsWlKYzzwXtLvcHDy3e_qm5nBHCbVg6GRBzw_06NYVOkoGmGIn8wZZDLjbqgjzlb-64TT6rZ4K5GciPh0lha0jI9EF6g6j642Ey-Ktvqc3Ruos_kpHmI78nygY0gtB70B7tcz5qtBv1OnmN5VKPyLy-Q6QuZvvWI');">
</div>
<!-- Dimming Overlay -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-md"></div>
</div>
<!-- Dialog Overlay / Canvas -->
<main class="fixed inset-0 z-50 flex items-center justify-center p-margin-edge">
<!-- Dialog Container -->
<section class="w-full max-w-md bg-surface-container-highest/90 backdrop-blur-2xl rounded-3xl border border-white/10 shadow-2xl overflow-hidden flex flex-col transform transition-all shadow-[0_32px_64px_-16px_rgba(0,0,0,0.5)]">
<!-- Header -->
<div class="px-margin-edge pt-margin-edge pb-container-gap flex items-center gap-4">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-[#ffb900]/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[#ffb900] text-3xl" data-weight="fill">warning</span>
</div>
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Low Storage Warning</h2>
</div>
<!-- Content Body -->
<div class="px-margin-edge py-container-gap flex flex-col gap-6">
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Only <strong class="text-on-surface">500MB</strong> remaining. Loop recording is enabled, and the oldest unprotected clips will be automatically deleted to make room for new recordings.
                </p>
<!-- Storage Visualization -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Storage Usage</span>
<span class="font-label-md text-label-md text-[#ffb900]">99% Full</span>
</div>
<!-- Progress Bar Track -->
<div class="h-3 w-full bg-surface-container-low rounded-full overflow-hidden border border-white/5">
<!-- Progress Bar Fill -->
<div class="h-full bg-gradient-to-r from-primary to-[#ffb900] w-[99%] rounded-full relative">
<!-- Pulse effect on the edge -->
<div class="absolute right-0 top-0 bottom-0 w-4 bg-white/30 animate-pulse rounded-r-full"></div>
</div>
</div>
<div class="flex justify-between mt-1">
<span class="font-label-md text-label-md text-on-surface-variant text-xs opacity-70">127.5 GB Used</span>
<span class="font-label-md text-label-md text-on-surface-variant text-xs opacity-70">500 MB Free</span>
</div>
</div>
</div>
<!-- Action Area -->
<div class="px-margin-edge pb-margin-edge pt-container-gap flex flex-col gap-3 mt-4">
<!-- Primary Action -->
<button class="w-full min-h-[48px] bg-primary text-on-primary font-label-xl text-label-xl rounded-xl flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors active:scale-[0.98] duration-150">
<span class="material-symbols-outlined" data-icon="video_library">video_library</span>
                    Manage Clips
                </button>
<!-- Secondary Action -->
<button class="w-full min-h-[48px] bg-transparent text-on-surface-variant font-label-xl text-label-xl rounded-xl flex items-center justify-center hover:bg-white/5 transition-colors active:bg-white/10 duration-150">
                    Dismiss
                </button>
</div>
</section>
</main>
</body></html>
