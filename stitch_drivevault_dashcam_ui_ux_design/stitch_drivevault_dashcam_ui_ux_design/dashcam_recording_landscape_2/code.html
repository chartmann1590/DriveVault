<style>
        /* Essential HUD utilities */
        .glass-panel {
            background-color: rgba(45, 27, 24, 0.6); /* surface-container with opacity */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .pulse-record {
            animation: pulse-soft 3s ease-in-out infinite;
        }
        
        @keyframes pulse-soft {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 85, 69, 0.4);
                opacity: 0.7;
            }
            50% {
                box-shadow: 0 0 10px 2px rgba(255, 85, 69, 0.8);
                opacity: 1;
            }
        }

        .segment-progress {
            transition: width 1s linear;
        }
        
        /* Ensure landscape locking if possible via CSS hints */
        @media screen and (orientation: portrait) {
            .rotate-warning {
                display: flex;
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container relative font-body-lg">
<!-- Portrait Warning -->
<div class="rotate-warning hidden fixed inset-0 z-[100] bg-surface flex-col items-center justify-center p-8 text-center glass-panel">
<span class="material-symbols-outlined text-6xl mb-4 text-primary" style="font-variation-settings: 'FILL' 1;">screen_rotation</span>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Please Rotate Device</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">The DriveVault HUD is optimized for landscape orientation to maximize situational awareness.</p>
</div>
<!-- Main Camera Feed Background -->
<div class="absolute inset-0 z-0 bg-black">
<img alt="Dashcam feed" class="w-full h-full object-cover opacity-80" data-alt="A high-contrast dashcam perspective view from a car driving on a modern highway at twilight or early night. The scene is illuminated by streetlights and vehicle headlights, creating a moody, professional automotive atmosphere. The aesthetic matches a high-end, reliable dashcam interface with deep charcoal tones and subtle glassmorphism elements overlaid. The lighting is low-key with bright, sharp accents from the road, optimized to minimize visual fatigue for night driving." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDI2nrTzlzoyn4bJKLMLm--uyTHagiaA-TU9iHW1wSxldMiGOdriYdJq1qwSBcegxHHunHD8kUtu_wf7TYHg0iyLi8KGreBtkDgZzNGPEX-dinorFej8h3W4IelWZHtnppYjqU1DdfRArzjzsNZpC2BSPRDV-hQK62xq9rm6g2SdCRdNH790mTEtzHnYFh58K2vEeL7cR_QmjHdCWMX24EG0LXEPYrPcT4ZvOm1PPGEZiLsoqepoYmCklXyCQGiXNsvRbL1suzOppOm"/>
</div>
<!-- HUD Layout Container -->
<div class="relative z-10 w-full h-full flex flex-col p-margin-edge pointer-events-none">
<!-- TOP ROW -->
<div class="flex justify-between items-start w-full pointer-events-auto">
<!-- Top Left: REC Status -->
<div class="glass-panel rounded-full px-4 py-2 flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-primary-container pulse-record"></div>
<span class="font-label-xl text-label-xl text-primary tracking-widest uppercase">Rec</span>
<span class="font-label-xl text-label-xl text-on-surface font-mono w-16" id="record-timer">00:42</span>
</div>
<!-- Top Center: Segment Progress -->
<div class="glass-panel rounded-full px-6 py-3 flex flex-col items-center gap-1 w-64 mt-1">
<div class="flex justify-between w-full font-label-md text-label-md text-on-surface-variant mb-1">
<span>Clip 4</span>
<span>14s left</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full segment-progress" style="width: 76%;"></div>
</div>
</div>
<!-- Top Right: System Status -->
<div class="glass-panel rounded-full px-4 py-2 flex items-center gap-container-gap text-on-surface-variant">
<div class="flex items-center gap-1" title="GPS Locked">
<span class="material-symbols-outlined text-xl text-tertiary">satellite_alt</span>
</div>
<div class="w-[1px] h-4 bg-outline-variant"></div>
<div class="flex items-center gap-1" title="Storage 82%">
<span class="material-symbols-outlined text-xl">sd_card</span>
<span class="font-label-md text-label-md">82%</span>
</div>
<div class="w-[1px] h-4 bg-outline-variant"></div>
<div class="flex items-center gap-1" title="Power Connected">
<span class="material-symbols-outlined text-xl text-primary">battery_charging_full</span>
</div>
</div>
</div>
<!-- MIDDLE ROW (Flexible Spacer) -->
<div class="flex-grow flex items-center justify-end w-full pt-4">
<!-- PIP Window (Front Camera while main is Back) -->
<div class="glass-panel rounded-xl overflow-hidden w-48 aspect-video border-2 border-surface-container relative pointer-events-auto shadow-2xl">
<img alt="Rear dashcam feed" class="w-full h-full object-cover" data-alt="A secondary picture-in-picture dashcam view showing the interior cabin or rear window perspective of a high-end vehicle. The cabin is dark, illuminated softly by dashboard instruments and passing streetlights. The aesthetic is utilitarian, reliable, and professional, consistent with a premium automotive safety system. The scene uses deep charcoal tones and high-contrast elements suitable for low-light driving conditions." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRh7ZRaEVkBhqCWLoD6T4-ZYnuxR4H0GaocqFtaBwI1pHPdJk8hP_EbpYM7rKLM-vnPRA0VQ8xTm0gBALeclkQ3f9_D2H3jWNB1XEtw6Zb3VDIvLPSrFaOMyi0TXXVgU7b6UCh34FwCHKPK3tyHaLtyLnvtvfhtsh9LU8pT1O07AjRufroAvDpK881Z1P_h3Iyb8AHINQ5QRDBwZA2Np4rul_BHBTUuyauenRZwZp-xhgx67c-AtjHjK_hMFl_Z9zW_kbEadiDsdyu"/>
<div class="absolute bottom-1 left-2 bg-surface-container/80 px-2 py-0.5 rounded text-[10px] font-bold text-on-surface uppercase tracking-wider backdrop-blur-sm">
                    Front
                </div>
</div>
</div>
<!-- BOTTOM ROW -->
<div class="flex justify-between items-end w-full pb-2 pointer-events-auto">
<!-- Bottom Left: Telemetry Panel -->
<div class="glass-panel rounded-2xl p-4 flex gap-6 items-end">
<!-- Speed -->
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-[-8px]">Speed</span>
<div class="flex items-baseline gap-1">
<span class="font-display-lg text-display-lg text-on-surface">43</span>
<span class="font-title-lg text-title-lg text-on-surface-variant font-medium">MPH</span>
</div>

<div class="w-[1px] h-12 bg-outline-variant self-center"></div>
<!-- Compass & Coords -->
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-headline-md text-headline-md text-on-surface leading-none">NE 047°</span>
</div>

</div>

<img alt="Map view" class="w-full h-full object-cover opacity-60 mix-blend-luminosity" data-alt="A stylized, dark-mode satellite or vector map view representing a GPS navigation interface. The map features deep charcoal and black backgrounds with subtle grey and muted blue routes. It fits perfectly into a modern, high-contrast automotive HUD, designed for low-glare visibility at night. The style is minimalist, highly functional, and premium, prioritizing essential navigation data over visual clutter." data-location="Los Angeles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHYficyLsRJ6kOXAVyK09-nsN-T6qPvIXfewbR_7tvanOD5eAf0xkKcFYDq6c0YwyRtDQZwy0aYMBS7VAe4azix50-bjixebOjLLfVGTnKg-rrvmZ1hZyGSWfhkR0n1m3Hk8Nd2XWwYp4jpAo9L3p4NUUo-lrANlAi9IKkg42gQ0QUHYTvIzor8cv6CJR3IqPzJZGky4hiTbYdTHNbbS8AM5myXrUrpjODC_oJekwyfVzXQS5YkTNITnGQUPkbq4IN1VEBpXojvUZF"/>
<div class="absolute inset-0 flex items-center justify-center">
<!-- Location Marker -->
<div class="w-4 h-4 bg-tertiary-container rounded-full border-2 border-surface shadow-[0_0_15px_rgba(75,142,255,0.6)] relative">
<div class="absolute inset-0 bg-tertiary-container rounded-full animate-ping opacity-50"></div>
</div>
</div>
<div class="absolute bottom-2 right-2 bg-surface-container/80 px-2 py-0.5 rounded text-[10px] font-bold text-on-surface-variant uppercase backdrop-blur-sm">
                    GPS LOCK
                </div>
</div>
<!-- Bottom Right: Action Controls -->
<div class="flex gap-container-gap">
<!-- Snapshot Button -->
<button class="glass-panel w-[64px] h-[64px] rounded-full flex flex-col items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 touch-target-min">
<span class="material-symbols-outlined text-on-surface text-2xl mb-0.5">photo_camera</span>
</button>
<!-- Stop Record Button -->
<button class="glass-panel w-[64px] h-[64px] rounded-full flex flex-col items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 touch-target-min">
<span class="material-symbols-outlined text-on-surface text-2xl mb-0.5">stop_circle</span>
</button>
<!-- Settings Button -->
<button class="glass-panel w-[64px] h-[64px] rounded-full flex flex-col items-center justify-center hover:bg-surface-variant transition-colors active:scale-95 touch-target-min">
<span class="material-symbols-outlined text-on-surface text-2xl mb-0.5">settings</span>
</button>
<!-- Emergency Lock Button (Prominent) -->
<button class="bg-primary-container text-on-primary-container h-[64px] px-6 rounded-full flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-95 touch-target-min shadow-lg border border-primary/30">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-headline-md-mobile text-headline-md-mobile font-bold uppercase tracking-wide">Lock Clip</span>
</button>
</div>
</div>
</div>
<script>
        // Simple script to increment the record timer for realism
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('record-timer');
            let seconds = 42;
            
            setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        });
    </script>
</body></html>
