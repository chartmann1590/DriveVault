<style>

<div class="flex gap-2">
<div class="glass-panel rounded-full px-3 py-1 flex items-center gap-1">
<span class="font-label-md text-label-md text-tertiary-container">4K HDR</span>
</div>

<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 0;">settings_remote</span>

<script>
        // Simple JS to toggle recording state for demonstration
        document.querySelector('.bg-primary-container.w-\\[140px\\]').addEventListener('click', function() {
            const recordingDot = document.querySelector('.recording-dot');
            if (recordingDot.style.animationPlayState === 'paused') {
                recordingDot.style.animationPlayState = 'running';
                this.style.backgroundColor = '#ff5545'; // primary-container
            } else {
                // simulate stopping
                recordingDot.style.animationPlayState = 'paused';
                this.style.backgroundColor = '#93000a'; // error-container
                setTimeout(() => {
                    recordingDot.style.animationPlayState = 'running';
                    this.style.backgroundColor = '#ff5545';
                }, 1000);
            }
        });
    </script>
