version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # lifecycle 2.11+ needs compileSdk 37 and AGP 9.1; revisit when the project moves to AGP 9
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.11.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
