name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with -Pstore=amazon (no Google Play
# links, no Play in-app review prompt). Run on a tablet-size emulator without Google Play
# services (like Fire). Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v7
    - name: Validate release secrets are present
      run: |
        missing=0
        for secret in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD ADMOB_APP_ID ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID; do
          value=$(printenv "${secret}" || true)
          if [ -z "$value" ]; then
            echo "Missing secret: $secret"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "One or more release secrets are missing. Refusing to ship an unsigned build or one with test ad IDs."
          exit 1
        fi
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Create local.properties
      run: |
        echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
        echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
        echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
        echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
        echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
        echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
        echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
        echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
        echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties
        echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
        echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
        echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> local.properties
    - name: Generate google-services.json
      run: python scripts/generate_google_services_json.py
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Decode release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "RELEASE_KEYSTORE_BASE64 secret is not set; release build will be unsigned."
          exit 0
        fi
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
        echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
    - name: Build amazon APK (store=amazon)
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew assembleRelease -Pstore=amazon 2>&1 | tee -a /tmp/amz-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p amz-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" amz-apk/DriveVault-amazon-release.apk
        ls -la amz-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs amz-apk/DriveVault-amazon-release.apk | head -3 || true
        $BT/aapt2 dump badging amz-apk/DriveVault-amazon-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the amazon release dex:"; unzip -p amz-apk/DriveVault-amazon-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_DriveVault_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/DriveVault-amazon-release.apk
