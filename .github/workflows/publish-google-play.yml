name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: "Type 'publish' to confirm submission to Google Play production"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional; defaults to recent commits or fallback)"
        required: false
        type: string
      release_status:
        description: "draft = uploads to production but requires a manual 'Send for review' click in Play Console; completed = rolls out immediately"
        required: false
        type: choice
        options:
          - draft
          - completed
        default: completed

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm publish intent
        run: |
          if [ "${{ github.event.inputs.confirm_play_publish }}" != "publish" ]; then
            echo "Workflow requires confirm_play_publish input to be exactly 'publish'. Got: '${{ github.event.inputs.confirm_play_publish }}'"
            exit 1
          fi
          echo "Play publish confirmed."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
          echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
          echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
          echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
          echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
          echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
          echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> local.properties

      - name: Generate google-services.json
        run: python scripts/generate_google_services_json.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set; cannot sign release."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "RELEASE_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          VERSION_CODE="$(date -u +'%y%j%H%M')"
          VERSION_NAME="1.0.0.$(date -u +'%Y%m%d.%H%M')"
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Version code: ${VERSION_CODE}"
          echo "Version name: ${VERSION_NAME}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build release App Bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify AAB signature
        run: |
          # apksigner only understands APKs, not AABs (it fails with "Missing
          # AndroidManifest.xml" against a bundle) - AABs are plain signed JARs,
          # so jarsigner is the correct tool to verify one.
          jarsigner -verify -verbose:summary app/build/outputs/bundle/release/*.aab

      - name: Generate release notes
        run: |
          # whatsnew-en-US must be a FILE directly inside distribution/whatsnew/,
          # not a directory - `mkdir -p .../whatsnew-en-US` here previously created
          # a directory at that exact path, so the later `>` redirect into the same
          # path failed with "Is a directory".
          mkdir -p distribution/whatsnew
          NOTES_FILE=distribution/whatsnew/whatsnew-en-US
          INPUT_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$INPUT_NOTES" ]; then
            echo "$INPUT_NOTES" > "$NOTES_FILE"
          else
            PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "${PREV_TAG}..HEAD" > "$NOTES_FILE"
            else
              git log --oneline HEAD~10..HEAD > "$NOTES_FILE" 2>/dev/null || true
            fi
          fi
          # Play Store "what's new" text has a 500-character limit per locale.
          if [ ! -s "$NOTES_FILE" ] || [ "$(wc -c < "$NOTES_FILE")" -gt 500 ]; then
            echo "Bug fixes and performance improvements." > "$NOTES_FILE"
          fi
          echo "Release notes:"
          cat "$NOTES_FILE"

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Verify Play service account
        env:
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi
          echo "Service account JSON verified."

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.drivevault.dashcam
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: ${{ github.event.inputs.release_status }}
          # draft releases are committed without being sent for review (reviewed manually
          # later in Play Console); the Play Developer API refuses to commit the edit
          # otherwise. completed releases go through review/rollout immediately as before.
          changesNotSentForReview: ${{ github.event.inputs.release_status == 'draft' }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
