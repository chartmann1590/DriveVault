name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets are present
        run: |
          missing=0
          for secret in GH_API_TOKEN GH_REPO_OWNER GH_REPO_NAME FIREBASE_PROJECT_ID FIREBASE_PROJECT_NUMBER FIREBASE_DEBUG_APP_ID FIREBASE_DEBUG_API_KEY FIREBASE_RELEASE_APP_ID FIREBASE_RELEASE_API_KEY FIREBASE_STORAGE_BUCKET SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            value=$(printenv "${secret}" || true)
            if [ -z "$value" ]; then
              echo "Missing secret: $secret"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. CI will likely fail at build time."
            exit 1
          fi
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_DEBUG_APP_ID: ${{ secrets.FIREBASE_DEBUG_APP_ID }}
          FIREBASE_DEBUG_API_KEY: ${{ secrets.FIREBASE_DEBUG_API_KEY }}
          FIREBASE_RELEASE_APP_ID: ${{ secrets.FIREBASE_RELEASE_APP_ID }}
          FIREBASE_RELEASE_API_KEY: ${{ secrets.FIREBASE_RELEASE_API_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build-debug:
    runs-on: ubuntu-latest
    needs: validate-secrets

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
          echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
          echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
          echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
          echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
          echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Generate google-services.json
        run: python scripts/generate_google_services_json.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    runs-on: ubuntu-latest
    needs: validate-secrets

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
          echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
          echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
          echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
          echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
          echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Generate google-services.json
        run: python scripts/generate_google_services_json.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  lint:
    runs-on: ubuntu-latest
    needs: validate-secrets
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
          echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
          echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
          echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
          echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
          echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Generate google-services.json
        run: python scripts/generate_google_services_json.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Upload Lint SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  unit-tests:
    runs-on: ubuntu-latest
    needs: validate-secrets

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "github.api.token=${{ secrets.GH_API_TOKEN }}" >> local.properties
          echo "github.repo.owner=${{ secrets.GH_REPO_OWNER }}" >> local.properties
          echo "github.repo.name=${{ secrets.GH_REPO_NAME }}" >> local.properties
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> local.properties
          echo "FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}" >> local.properties
          echo "FIREBASE_DEBUG_APP_ID=${{ secrets.FIREBASE_DEBUG_APP_ID }}" >> local.properties
          echo "FIREBASE_DEBUG_API_KEY=${{ secrets.FIREBASE_DEBUG_API_KEY }}" >> local.properties
          echo "FIREBASE_RELEASE_APP_ID=${{ secrets.FIREBASE_RELEASE_APP_ID }}" >> local.properties
          echo "FIREBASE_RELEASE_API_KEY=${{ secrets.FIREBASE_RELEASE_API_KEY }}" >> local.properties
          echo "FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Generate google-services.json
        run: python scripts/generate_google_services_json.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

# GitHub Pages deploys are owned by .github/workflows/pages.yml to avoid
# duplicate concurrent deployments racing against this build pipeline.
