name: Crash Fix Checker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FIREBASE_PROJECT_NUMBER: '936645189436'
  FIREBASE_APP_ID: '1:936645189436:android:4161e4d4f8316a723a8839'
  FIREBASE_PROJECT_ID: 'drivevault-dashcam-2026'

jobs:
  crash-fix-check:
    runs-on: ubuntu-latest
    if: github.repository == 'chartmann1590/DriveVault'

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exchange Firebase refresh token for access token
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${FIREBASE_OAUTH_CLIENT_ID}" \
            --data-urlencode "client_secret=${FIREBASE_OAUTH_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${FIREBASE_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain access token"; echo "$RESPONSE" | jq .; exit 1
          fi
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run crash-fix checker
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const SCRIPT_START = new Date();
            const OWNER = context.repo.owner;
            const REPO = context.repo.repo;
            const PROJECT_NUMBER = process.env.FIREBASE_PROJECT_NUMBER;
            const APP_ID = process.env.FIREBASE_APP_ID;
            const PROJECT_ID = process.env.FIREBASE_PROJECT_ID;
            const LABELS = ['crashlytics', 'bug'];
            const { promisify } = require('util');
            const execPromise = promisify(require('child_process').exec);

            const HIDDEN_MARKER_PROCESSED = '<!-- crash-fix-checked -->';

            // -----------------------------------------------------------------
            // Shared helpers
            // -----------------------------------------------------------------
            async function sh(cmd) {
              const { stdout, stderr } = await execPromise(cmd, { cwd: process.env.GITHUB_WORKSPACE });
              if (stderr && !stderr.trimStart().startsWith('warning:')) {
                console.warn('stderr:', stderr.trim());
              }
              return stdout.trim();
            }

            function parseCrashlyticsBody(body) {
              if (!body) return {};
              const result = {};
              const idMatch = body.match(/\*\*Crashlytics ID\*\*\s*\|\s*`?([a-f0-9-]+)`?/);
              if (idMatch) result.crashlyticsId = idMatch[1];
              const blameMatch = body.match(/\*\*Blame frame\*\*\s*\|\s*`?([^`\n|]+)`?/);
              if (blameMatch) result.blameFrame = blameMatch[1].trim();
              const exceptionMatch = body.match(/\*\*Exception\*\*\s*\|\s*([^\n|]+)/);
              if (exceptionMatch) result.exception = exceptionMatch[1].trim();
              const typeMatch = body.match(/\*\*Error type\*\*\s*\|\s*([^\n|]+)/);
              if (typeMatch) result.errorType = typeMatch[1].trim();
              const lastSeenMatch = body.match(/<!--\s*crashlytics-last-seen:\s*(\d{4}-\d{2}-\d{2})\s*-->/);
              if (lastSeenMatch) result.lastSeen = lastSeenMatch[1];
              return result;
            }

            function parseFeedbackBody(body) {
              if (!body) return { description: 'No description', package: 'unknown', version: 'unknown' };
              const descMatch = body.match(/##\s*Description\s*\n([\s\S]*?)(?=\n##\s|$)/i);
              const pkgMatch = body.match(/- Package:\s*(.+)/);
              const verMatch = body.match(/- Version:\s*(.+)/);
              return {
                description: descMatch ? descMatch[1].trim().substring(0, 300) : 'No description',
                package: pkgMatch ? pkgMatch[1].trim() : 'unknown',
                version: verMatch ? verMatch[1].trim() : 'unknown',
              };
            }

            async function closeCrashlyticsIssue(crashlyticsId) {
              const token = process.env.ACCESS_TOKEN;
              if (!token) throw new Error('ACCESS_TOKEN not available');
              const appIdEncoded = encodeURIComponent(APP_ID);
              const url = `https://firebasecrashlytics.googleapis.com/v1alpha/projects/${PROJECT_NUMBER}/apps/${appIdEncoded}/issues/${crashlyticsId}`;
              const resp = await fetch(url, {
                method: 'PATCH',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ state: 'CLOSED' }),
              });
              if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`Crashlytics API error ${resp.status}: ${text.substring(0, 200)}`);
              }
              console.log(`Crashlytics issue ${crashlyticsId} closed upstream.`);
            }

            // -----------------------------------------------------------------
            // 1. Collect fix commits from the last 90 days
            // -----------------------------------------------------------------
            const FIX_KEYWORDS = [
              /\bfix\s*[:=-]/i,
              /\bfix(?:es|ed)?\s+(?:crash|bug|issue|recording|storage|overlay|camera|notification|coroutine|animation|compose|permission)/i,
              /\bresolve[sd]?\s*(?:crash|bug|issue|dependabot)/i,
              /\bNPE\b/,
              /\bNullPointer(?:Exception)?\b/,
              /\bRuntimeException\b/,
              /\bIndexOutOfBounds(?:Exception)?\b/,
              /\bIllegalState(?:Exception)?\b/,
              /\bIllegalArgument(?:Exception)?\b/,
              /\bClassCast(?:Exception)?\b/,
              /\bConcurrentModification(?:Exception)?\b/,
              /\bANR\b/,
              /\bKeyframesSpec\b/,
            ];

            function isFixCommit(message) {
              for (const re of FIX_KEYWORDS) {
                if (re.test(message)) return true;
              }
              return false;
            }

            const fixCommitsRaw = [];
            const gitLog = await sh(`git log --since="90 days ago" --format="%H-----%h-----%s-----%ai" --name-only`);

            if (gitLog) {
              const blocks = gitLog.split(/\n(?=[0-9a-f]{40}-----)/);
              for (const block of blocks) {
                const lines = block.split('\n').filter(Boolean);
                if (lines.length < 1) continue;
                const parts = lines[0].split('-----');
                if (parts.length < 4) continue;
                const [fullHash, shortHash, subject, dateIso] = parts;
                const message = subject || '';
                if (!isFixCommit(message)) continue;
                const files = lines.slice(1).map(f => f.trim()).filter(Boolean);
                fixCommitsRaw.push({ fullHash, shortHash, message, date: dateIso, files });
              }
            }

            console.log(`Found ${fixCommitsRaw.length} fix commits in the last 90 days.`);
            for (const c of fixCommitsRaw) {
              console.log(`  ${c.shortHash} ${c.message}`);
            }

            // -----------------------------------------------------------------
            // 2. Load all open issues labeled "crashlytics" or "bug"
            // -----------------------------------------------------------------
            const issues = [];
            for (const label of LABELS) {
              const issuesIter = github.paginate.iterator(
                github.rest.issues.listForRepo,
                { owner: OWNER, repo: REPO, state: 'open', labels: label, per_page: 100 }
              );
              for await (const page of issuesIter) {
                for (const issue of page.data) {
                  if (issue.pull_request) continue;
                  if (!issues.some(i => i.number === issue.number)) {
                    issues.push(issue);
                  }
                }
              }
            }

            console.log(`Found ${issues.length} open issues labeled "crashlytics" or "bug".`);

            if (issues.length === 0 && fixCommitsRaw.length === 0) {
              return { message: 'No open target issues and no fix commits found.' };
            }

            // -----------------------------------------------------------------
            // Build known source file index once
            // -----------------------------------------------------------------
            let knownFiles = [];
            try {
              const allFiles = await sh('git ls-files -- "*.kt" "*.java"');
              knownFiles = allFiles.split('\n').filter(Boolean);
            } catch (e) {
              console.warn('Could not build file index:', e.message);
              knownFiles = [];
            }

            // -----------------------------------------------------------------
            // Issue-processing helpers
            // -----------------------------------------------------------------
            function fqcnToPath(fqcn) {
              const pkgPath = fqcn.replace(/\./g, '/');
              return `app/src/main/java/${pkgPath}.kt`;
            }

            function classNameToPaths(className) {
              return knownFiles.filter(f => f.endsWith(`/${className}.kt`) || f.endsWith(`/${className}.java`));
            }

            function extractAffectedFilesFromCrashlytics(blameFrame, exception) {
              const source = [blameFrame, exception].filter(Boolean).join(' ');
              if (!source) return [];
              const files = new Set();

              const fqcnRe = /(com\.drivevault\.dashcam(?:\.[a-zA-Z0-9_]+)+(?:\.[A-Z][a-zA-Z0-9_]*))/g;
              let m;
              while ((m = fqcnRe.exec(source)) !== null) {
                files.add(fqcnToPath(m[1]));
              }

              const classRe = /\b([A-Z][a-zA-Z0-9_]*(?:Manager|Service|Screen|Worker|Provider|Receiver|View|ViewModel|Model|Helper|Client|Factory|Repo|Repository|Database|Fragment|Activity|Adapter|Interceptor|Handler|Listener|Observer|Delegate|Mapper|Converter))\b/g;
              while ((m = classRe.exec(source)) !== null) {
                const paths = classNameToPaths(m[1]);
                for (const p of paths) files.add(p);
              }

              const stackRe = /\bat\s+(com\.drivevault\.dashcam(?:\.[a-zA-Z0-9_]+)+(?:\.[A-Z][a-zA-Z0-9_]*))(?:\(|\.|$)/gm;
              while ((m = stackRe.exec(source)) !== null) {
                files.add(fqcnToPath(m[1]));
              }

              return [...files];
            }

            function extractAffectedFilesFromFeedback(body) {
              if (!body) return [];
              const files = new Set();
              const fqcnRe = /(com\.drivevault\.dashcam(?:\.[a-zA-Z0-9_]+)+(?:\.[A-Z][a-zA-Z0-9_]*))/g;
              let m;
              while ((m = fqcnRe.exec(body)) !== null) {
                files.add(fqcnToPath(m[1]));
              }
              const classRe = /\b([A-Z][a-zA-Z0-9_]*(?:Manager|Service|Screen|Worker|Provider|Receiver|View|ViewModel|Model|Helper|Client|Factory|Repo|Repository|Database|Fragment|Activity|Adapter|Interceptor|Handler|Listener|Observer|Delegate|Mapper|Converter))\b/g;
              while ((m = classRe.exec(body)) !== null) {
                const paths = classNameToPaths(m[1]);
                for (const p of paths) files.add(p);
              }
              const stackRe = /\bat\s+(com\.drivevault\.dashcam(?:\.[a-zA-Z0-9_]+)+(?:\.[A-Z][a-zA-Z0-9_]*))(?:\(|\.|$)/gm;
              while ((m = stackRe.exec(body)) !== null) {
                files.add(fqcnToPath(m[1]));
              }
              return [...files];
            }

            function commitsTouchingFile(commits, targetFile) {
              const targetLower = targetFile.toLowerCase();
              const targetBase = targetFile.split('/').pop().toLowerCase();
              return commits.filter(c =>
                c.files.some(f => {
                  const fLower = f.toLowerCase();
                  return fLower === targetLower || fLower.endsWith('/' + targetBase);
                })
              );
            }

            async function checkIfAlreadyProcessed(issueNumber) {
              const commentsIter = github.paginate.iterator(
                github.rest.issues.listComments,
                { owner: OWNER, repo: REPO, issue_number: issueNumber, per_page: 100 }
              );
              for await (const page of commentsIter) {
                for (const comment of page.data) {
                  const body = comment.body || '';
                  if (
                    body.includes(HIDDEN_MARKER_PROCESSED) ||
                    body.includes('pending review') ||
                    body.includes('pending deploy') ||
                    body.includes('pending store review')
                  ) {
                    return true;
                  }
                }
              }
              return false;
            }

            function formatCommitLink(shortHash, message) {
              const line1 = message.split('\n')[0].substring(0, 80);
              return `- [\`${shortHash}\`](https://github.com/${OWNER}/${REPO}/commit/${shortHash}) — ${line1}`;
            }

            function formatDate(d) {
              return d.toISOString().split('T')[0];
            }

            // -----------------------------------------------------------------
            // 3. Process each open issue
            // -----------------------------------------------------------------
            let processedCount = 0;
            let closedCount = 0;
            const todayStr = formatDate(SCRIPT_START);

            for (const issue of issues) {
              const body = issue.body || '';
              const issueNumber = issue.number;

              if (issue.pull_request) continue;

              if (body.includes(HIDDEN_MARKER_PROCESSED)) {
                console.log(`Issue #${issueNumber}: already marked as processed. Skipping.`);
                continue;
              }

              const alreadyProcessed = await checkIfAlreadyProcessed(issueNumber);
              if (alreadyProcessed) {
                console.log(`Issue #${issueNumber}: already processed (comment marker found). Skipping.`);
                continue;
              }

              // Determine issue format: Crashlytics (table) vs Feedback (## sections)
              const isCrashlyticsIssue = body.includes('**Crashlytics ID**');
              const crashInfo = isCrashlyticsIssue ? parseCrashlyticsBody(body) : {};

              // --- 3a. Stale crash check (5-day silence, Crashlytics issues only) ---
              if (isCrashlyticsIssue && crashInfo.lastSeen) {
                const lastSeenDate = new Date(crashInfo.lastSeen + 'T00:00:00Z');
                const today = new Date(todayStr + 'T00:00:00Z');
                const diffDays = Math.floor((today - lastSeenDate) / (1000 * 60 * 60 * 24));

                if (diffDays >= 5) {
                  console.log(`Issue #${issueNumber}: last crash seen ${crashInfo.lastSeen} (${diffDays} days ago) — closing as stale.`);

                  await github.rest.issues.createComment({
                    owner: OWNER,
                    repo: REPO,
                    issue_number: issueNumber,
                    body: [
                      '## Auto-Closed: Crash Inactivity',
                      '',
                      `This issue has had no new crash events for **${diffDays} consecutive days** (last seen: ${crashInfo.lastSeen}).`,
                      '',
                      'The issue is being automatically closed. If the crash reappears, a new issue will be opened or this one can be reopened.',
                      '',
                      '| Status |',
                      '|--------|',
                      '| Closed due to inactivity |',
                      '',
                      HIDDEN_MARKER_PROCESSED,
                    ].join('\n'),
                  });

                  await github.rest.issues.update({
                    owner: OWNER,
                    repo: REPO,
                    issue_number: issueNumber,
                    state: 'closed',
                  });

                  if (crashInfo.crashlyticsId && process.env.ACCESS_TOKEN) {
                    try {
                      await closeCrashlyticsIssue(crashInfo.crashlyticsId);
                    } catch (e) {
                      console.warn(`Failed to close Crashlytics issue for #${issueNumber}: ${e.message}`);
                    }
                  }

                  closedCount++;
                  continue;
                }
              }

              // --- 3b. Extract affected files and find fix commits ---
              let affectedFiles;
              if (isCrashlyticsIssue) {
                affectedFiles = extractAffectedFilesFromCrashlytics(crashInfo.blameFrame, crashInfo.exception);
              } else {
                affectedFiles = extractAffectedFilesFromFeedback(body);
              }

              console.log(`Issue #${issueNumber}: extracted ${affectedFiles.length} affected files.`);

              let matchedCommits = [];
              if (affectedFiles.length > 0) {
                for (const af of affectedFiles) {
                  const hits = commitsTouchingFile(fixCommitsRaw, af);
                  for (const h of hits) {
                    if (!matchedCommits.some(mc => mc.fullHash === h.fullHash)) {
                      matchedCommits.push(h);
                    }
                  }
                }
              }

              // Fallback: keyword overlap
              if (matchedCommits.length === 0) {
                const descWords = new Set(body.toLowerCase().split(/\W+/).filter(w => w.length > 3));
                for (const c of fixCommitsRaw) {
                  const subjectWords = c.message.toLowerCase().split(/\W+/).filter(w => w.length > 3);
                  const overlap = subjectWords.filter(w => descWords.has(w));
                  if (overlap.length >= 2) {
                    matchedCommits.push(c);
                  }
                }
              }

              if (matchedCommits.length > 0) {
                console.log(`Issue #${issueNumber}: found ${matchedCommits.length} matching fix commits.`);

                let summaryMd;
                if (isCrashlyticsIssue) {
                  summaryMd = [
                    `- **Exception**: ${crashInfo.exception || 'Unknown'}`,
                    `- **Blame frame**: \`${crashInfo.blameFrame || 'Unknown'}\``,
                    `- **Error type**: ${crashInfo.errorType || 'Unknown'}`,
                    `- **Crashlytics ID**: \`${crashInfo.crashlyticsId || 'N/A'}\``,
                  ].join('\n');
                } else {
                  const fb = parseFeedbackBody(body);
                  summaryMd = [
                    `- **Description**: ${fb.description}`,
                    `- **Package**: ${fb.package}`,
                    `- **Version**: ${fb.version}`,
                  ].join('\n');
                }

                const commitLines = matchedCommits.map(c => formatCommitLink(c.shortHash, c.message));
                const changedFiles = [...new Set(matchedCommits.flatMap(c => c.files))].sort();

                const commentBody = [
                  '## Fix Detected for This Crash/Bug',
                  '',
                  '### Summary',
                  '',
                  summaryMd,
                  '',
                  '### Fix Commits',
                  '',
                  ...commitLines,
                  '',
                  '### Files Changed',
                  '',
                  ...changedFiles.map(f => `- \`${f}\``),
                  '',
                  '### Status',
                  '',
                  '| Stage | Status |',
                  '|-------|--------|',
                  '| Fix committed | :white_check_mark: |',
                  '| Review / deploy pending | :hourglass: |',
                  '| Live for users | :hourglass: |',
                  '',
                  '> This issue will be automatically closed once the fix is confirmed live for users. If the crash continues after the fix is deployed, a new issue will be filed.',
                  '',
                  HIDDEN_MARKER_PROCESSED,
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  body: commentBody,
                });

                processedCount++;
              } else {
                console.log(`Issue #${issueNumber}: no matching fix commits found.`);
              }
            }

            return {
              message: `Processed ${processedCount} issues with fix notifications, closed ${closedCount} stale issues.`,
              processed: processedCount,
              closed: closedCount,
              fixCommitsFound: fixCommitsRaw.length,
              issuesEvaluated: issues.length,
            };
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ env.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ env.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
